  <link rel="stylesheet" href="/dist/style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
    <section>
      <picture>
        <!-- Desktop image (for screens wider than 768px) -->
        <source 
          srcset="./images/image-product-desktop.jpg" 
          media="(min-width: 768px)"
        >
        <!-- Mobile image (default for screens smaller than 768px) -->
        <img 
          src="./images/image-product-mobile.jpg" 
          alt="Product Image"
        >
      </picture>
    
    </section>
    <section>
      <span id="perfume">PERFUME</span>
      <h1>Gabrielle Essence Eau De Parfum</h1>
      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
      <h2>$149.99 <span id="original">$169.99</span></h2>
      <button><img src="./images/icon-cart.svg" alt=""> Add to Cart</button>
    </section>
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
