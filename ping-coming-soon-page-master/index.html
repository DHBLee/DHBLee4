  <title>Frontend Mentor | Ping coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <img id="logo" src="./images/logo.svg" alt="">
    <h1>We are launching <span>soon!</span></h1>
    <p>Subscribe and get notified</p>
    <form action="">
      <label id="hidden" for="email"></label>
      <div class="wrapper">
        <input id="email" type="email" placeholder="Your email address">
        <span id="error">Please provide a valid email address</span>
      </div>
      <button id="button">Notify Me</button>
    </form>
    <img id="image" src="./images/illustration-dashboard.png" alt="">
    <ul class="socials">
      <li>
        <i class="ri-facebook-fill"></i>
      </li>
      <li>
        <i class="ri-twitter-fill"></i>
      </li>
      <li>
        <i class="ri-instagram-line"></i>
      </li>
    </ul>
    <span id="copyright">&copy; Copyright Ping. All rights reserved</span>
  </main>

  <footer>
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">DHBLee</a>.
    </p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
